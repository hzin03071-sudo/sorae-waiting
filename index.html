<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#075985">
  <title>소래포구축제 전자 웨이팅</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="hero">
    <div class="container">
      <div class="brand-row">
        <div>
          <p class="kicker">2026 소래포구축제</p>
          <h1>전자 웨이팅</h1>
          <p class="hero-copy">원하는 체험을 선택하고 대기번호를 받아주세요.</p>
        </div>
        <div class="hero-icon">🌊</div>
      </div>
    </div>
  </header>

  <main class="container main-space">
    <section class="info-banner">
      <strong>대기 등록 후 화면을 닫아도 다시 확인할 수 있습니다.</strong>
      <span>동일한 휴대폰 브라우저로 접속해주세요.</span>
    </section>

    <section id="activeTicketBox" class="active-ticket hidden"></section>
    <section id="boothGrid" class="booth-grid"></section>

    <div id="loadingState" class="loading-card">실시간 대기 현황을 불러오는 중입니다.</div>
  </main>

  <dialog id="reservationDialog">
    <form id="reservationForm" class="modal-card">
      <button type="button" id="dialogClose" class="modal-close" aria-label="닫기">×</button>
      <p class="kicker">대기 등록</p>
      <h2 id="dialogBoothName">체험명</h2>

      <label>
        예약자 이름
        <input id="customerName" maxlength="20" autocomplete="name" required placeholder="예: 홍길동">
      </label>

      <label>
        휴대폰 번호
        <input id="phoneNumber" inputmode="tel" autocomplete="tel" maxlength="13" required placeholder="010-1234-5678">
      </label>

      <label>
        참여 인원
        <select id="partySize">
          <option value="1">1명</option>
          <option value="2">2명</option>
          <option value="3">3명</option>
          <option value="4">4명</option>
          <option value="5">5명</option>
          <option value="6">6명</option>
        </select>
      </label>

      <label class="privacy-check">
        <input id="privacyAgree" type="checkbox" required>
        <span>웨이팅 운영을 위한 개인정보 수집·이용에 동의합니다.</span>
      </label>

      <button id="reserveSubmit" class="btn btn-primary" type="submit">대기번호 받기</button>
    </form>
  </dialog>

  <script type="module" src="/assets/visitor.js"></script>
</body>
</html>
