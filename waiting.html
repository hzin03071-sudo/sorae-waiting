<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>내 대기번호</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <header class="hero compact">
    <div class="wrap">
      <p class="eyebrow">2026 소래포구축제</p>
      <h1>내 대기 현황</h1>
    </div>
  </header>

  <main class="wrap narrow">
    <section id="waitingCard" class="card waiting-card">
      <p id="boothName" class="tag"></p>
      <p class="muted">내 대기번호</p>
      <div id="ticketNumber" class="ticket-number">-</div>

      <div id="callMessage" class="call-message">대기 현황을 확인하고 있습니다.</div>

      <div class="metrics vertical">
        <div><span>현재 호출</span><strong id="currentRange">-</strong></div>
        <div><span>내 앞 대기팀</span><strong id="aheadCount">-</strong></div>
        <div><span>예상 대기시간</span><strong id="estimateTime">-</strong></div>
      </div>

      <div class="recommend">
        <strong>기다리는 동안 둘러보세요</strong>
        <p>먹거리존 · 수산시장 · K-뷰티존</p>
      </div>

      <button id="cancelButton" class="danger-outline">대기 취소</button>
      <a class="text-link" href="./index.html">다른 체험 보기</a>
    </section>
  </main>

  <script type="module" src="./assets/waiting.js"></script>
</body>
</html>
