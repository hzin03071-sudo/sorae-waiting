<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <title>내 대기 현황 | 2026 소래포구축제</title>

<link rel="stylesheet" href="/assets/style.css?v=20260728">
</head>

<body>
  <header class="hero hero-small">
    <div class="container">
      <p class="kicker">
        2026 소래포구축제
      </p>

      <h1>
        내 대기 현황
      </h1>
    </div>
  </header>


  <main class="container ticket-page">
    <section class="ticket-card">

      <!-- 체험명 -->
      <p
        id="boothName"
        class="booth-label"
      >
        체험 정보를 확인하고 있습니다.
      </p>


      <!-- 대기번호 -->
      <p class="sub-label">
        내 대기번호
      </p>

      <div
        id="ticketNumber"
        class="ticket-number"
      >
        -
      </div>


      <!-- 현재 상태 -->
      <div
        id="statusMessage"
        class="status-message"
        role="status"
        aria-live="polite"
      >
        대기 현황을 확인하고 있습니다.
      </div>


      <!-- 대기 현황 -->
      <div class="ticket-stats">
        <div>
          <span>
            현재 입장
          </span>

          <strong id="currentNumber">
            -
          </strong>
        </div>

        <div>
          <span>
            내 앞 대기팀
          </span>

          <strong id="aheadCount">
            -
          </strong>
        </div>

        <div>
          <span>
            예상 대기시간
          </span>

          <strong id="estimatedTime">
            -
          </strong>
        </div>
      </div>


      <!-- 주변 콘텐츠 안내 -->
      <section class="recommend-card">
        <strong>
          기다리는 동안 둘러보세요
        </strong>

        <p>
          먹거리존 · 수산시장 · K-뷰티존
        </p>
      </section>


      <!-- 알림 신청 -->
      <section class="notification-card">
        <strong>
          입장 순서를 놓치지 마세요
        </strong>

        <p id="notificationStatus">
          알림을 허용하면 입장 순서가 되었을 때 알려드립니다.
        </p>

        <button
          id="notificationButton"
          class="btn btn-primary"
          type="button"
        >
          입장 알림 받기
        </button>
      </section>


      <!-- 대기 취소 -->
      <button
        id="cancelButton"
        class="btn btn-danger-outline"
        type="button"
      >
        대기 취소
      </button>


      <!-- 다른 체험 -->
      <a
        href="/"
        class="back-link"
      >
        다른 체험 보기
      </a>

    </section>
  </main>


<script
  type="module"
  src="/assets/waiting.js?v=20260728-1815"
  ></script>
</body>
</html>
