<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>내 대기 현황</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="hero hero-small">
    <div class="container">
      <p class="kicker">2026 소래포구축제</p>
      <h1>내 대기 현황</h1>
    </div>
  </header>

  <main class="container ticket-page">
    <section class="ticket-card">
      <p id="ticketBooth" class="booth-label">체험명</p>
      <p class="sub-label">내 대기번호</p>
      <div id="ticketNumber" class="ticket-number">-</div>

      <div id="statusMessage" class="status-message">대기 현황을 확인하고 있습니다.</div>

      <div class="ticket-stats">
        <div>
          <span>현재 입장</span>
          <strong id="currentCall">-</strong>
        </div>
        <div>
          <span>내 앞 대기팀</span>
          <strong id="aheadTeams">-</strong>
        </div>
        <div>
          <span>예상 대기시간</span>
          <strong id="estimatedWait">-</strong>
        </div>
      </div>

<section class="recommend-card">
  <strong>기다리는 동안 둘러보세요</strong>
  <p>먹거리존 · 수산시장 · K-뷰티존</p>
</section>

<section class="notification-card">
  <strong>입장 순서를 놓치지 마세요</strong>
  <p id="notificationMessage">
    알림을 허용하면 입장 순서가 되었을 때 알려드립니다.
  </p>

  <button id="enableNotification" class="btn btn-primary">
    입장 알림 받기
  </button>
</section>

<button id="cancelReservation" class="btn btn-danger-outline">대기 취소</button>
      <a href="/" class="back-link">다른 체험 보기</a>
    </section>
  </main>

  <script type="module" src="/assets/waiting.js"></script>
</body>
</html>
